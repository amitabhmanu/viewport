name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the viewer's end-to-end test
        run: pnpm --filter @viewport/web exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Validate plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
